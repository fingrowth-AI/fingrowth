name: FinGrowth

options:
  bundleIdPrefix: com.fingrowth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  xcodeVersion: "16.2"
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ANALYZER_NONNULL: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ALWAYS_SEARCH_USER_PATHS: NO

targets:
  FinGrowth:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FinGrowth
        excludes:
          - "**/.DS_Store"
    dependencies:
      # llama.cpp inference backend (P5-01 real path). Dynamic XCFramework built
      # from upstream ggml-org/llama.cpp via build-xcframework.sh; gitignored and
      # rebuilt locally, not committed. Its modulemap self-links c++/Accelerate/
      # Metal/Foundation, so no extra OTHER_LDFLAGS are needed. Linking it makes
      # `canImport(llama)` true, which swaps GemmaService onto LlamaCppBackend.
      - framework: vendor/llama.cpp/build-apple/llama.xcframework
        embed: true
        codeSign: true
    # NOTE: the com.apple.developer.kernel.increased-memory-limit entitlement
    # would help a ~4.5GB E4B model avoid jetsam, but a free Personal Team can't
    # sign it. Omitted for now — llama.cpp mmaps the GGUF so resident memory is
    # the working set + KV cache, which can fit under the default ceiling on an
    # 8GB Pro. Re-add this (with a paid team) if E4B gets memory-killed.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fingrowth.FinGrowth
        PRODUCT_NAME: FinGrowth
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # App icon lives in FinGrowth/Assets.xcassets (AppIcon.appiconset,
        # single 1024x1024 RGB image). The asset catalog is picked up by the
        # `path: FinGrowth` source glob; this names the icon set to compile.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # V8-01: apply the entitlements file so the app declares the Sign in with
        # Apple capability. Builds on the simulator without a provisioning
        # profile; a paid team is needed to sign it for device/TestFlight. The
        # path is indirected through a build variable (default in Signing.xcconfig)
        # so a free Personal Team can blank it in the gitignored
        # Signing.local.xcconfig and install on a device without that capability.
        CODE_SIGN_ENTITLEMENTS: $(FINGROWTH_CODE_SIGN_ENTITLEMENTS)
        # Partial plist merged with the generated keys — adds the ATS local-net
        # exception + local-network usage string so the device can reach the
        # backend over plaintext HTTP on the LAN. See FinGrowth/Info.plist.
        INFOPLIST_FILE: FinGrowth/Info.plist
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        INFOPLIST_KEY_CFBundleDisplayName: "FinGrowth"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # DEVELOPMENT_TEAM is supplied by the gitignored Signing.local.xcconfig
        # (configFiles below) so a personal Team ID never lands in committed
        # source. Without that file the simulator still builds; a device build
        # just needs the team picked once in Xcode.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig

  FinGrowthTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: FinGrowth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fingrowth.FinGrowthTests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES

schemes:
  FinGrowth:
    build:
      targets:
        FinGrowth: all
        FinGrowthTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - FinGrowthTests
    archive:
      config: Release
